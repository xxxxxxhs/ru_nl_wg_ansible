- name: copy wg transit conf
  ansible.builtin.template:
    src: wg1.conf.j2
    dest: /etc/wireguard/wg1.conf
    owner: root
    group: root
    mode: '0600'
  notify: restart wg1

- name: stop and disable legacy plain wg0
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    state: stopped
    enabled: false
  failed_when: false

- name: ensure amneziawg config dir exists
  ansible.builtin.file:
    path: /etc/amnezia/amneziawg
    state: directory
    mode: '0700'

- name: copy awg users conf
  ansible.builtin.template:
    src: awg0.conf.j2
    dest: /etc/amnezia/amneziawg/awg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: restart awg0

- name: enable wg1
  ansible.builtin.systemd_service:
    name: wg-quick@wg1
    state: started
    enabled: true
    daemon_reload: true

- name: enable awg0
  ansible.builtin.systemd_service:
    name: awg-quick@awg0
    state: started
    enabled: true

- name: Ensure local client-configs dir exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../client-configs"
    state: directory
    mode: '0700'
  delegate_to: localhost
  run_once: true

- name: Generate client configs locally
  ansible.builtin.template:
    src: client.conf.j2
    dest: "{{ playbook_dir }}/../client-configs/{{ item.name }}.conf"
    mode: '0600'
  loop: "{{ wg_clients }}"
  delegate_to: localhost