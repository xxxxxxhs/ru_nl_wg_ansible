- name: remove legacy AmneziaWG PPA list without key
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/amnezia-ubuntu-ppa.list
    state: absent

- name: install wireguard & ipset
  ansible.builtin.apt:
    name:
      - wireguard
      - ipset
      - jq
      - curl
      - software-properties-common
      - python3-debian
    state: present
    update_cache: true

- name: Get upstream Ubuntu codename
  ansible.builtin.shell: grep -oP '(?<=UBUNTU_CODENAME=).+' /etc/os-release || echo "{{ ansible_distribution_release }}"
  register: ubuntu_codename
  changed_when: false

- name: add AmneziaWG PPA
  ansible.builtin.deb822_repository:
    name: amnezia-ppa
    types: deb
    uris: https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu
    suites: "{{ ubuntu_codename.stdout }}"
    components: main
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x4166F2C257290828

- name: install AmneziaWG and kernel headers
  ansible.builtin.apt:
    name:
      - "linux-headers-{{ ansible_kernel }}"
      - "amneziawg{{ '' if amneziawg_version == 'latest' else '=' ~ amneziawg_version }}"
      - "amneziawg-tools{{ '' if amneziawg_tools_version == 'latest' else '=' ~ amneziawg_tools_version }}"
    state: "{{ 'latest' if amneziawg_version == 'latest' else 'present' }}"
    allow_downgrade: true
    update_cache: true
  notify: restart awg0
