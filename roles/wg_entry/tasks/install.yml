- name: install wireguard & ipset
  ansible.builtin.apt:
    name:
      - wireguard
      - ipset
      - jq
      - curl
      - software-properties-common
    state: present
    update_cache: true

- name: Get upstream Ubuntu codename
  ansible.builtin.shell: grep -oP '(?<=UBUNTU_CODENAME=).+' /etc/os-release || echo "{{ ansible_distribution_release }}"
  register: ubuntu_codename
  changed_when: false

- name: add AmneziaWG PPA
  ansible.builtin.apt_repository:
    repo: "deb https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu {{ ubuntu_codename.stdout }} main"
    filename: amnezia-ubuntu-ppa
    state: present

- name: install AmneziaWG and kernel headers
  ansible.builtin.apt:
    name:
      - "linux-headers-{{ ansible_kernel }}"
      - amneziawg
      - amneziawg-tools
    state: present
    update_cache: true